baseURL = "https://fenwickyduck.github.io/"
locale = "en-GB"
title = "Seyoon Park"

# Dates without a time (e.g. `date: 2026-08-12`) are interpreted in this zone.
# Without it, Hugo assumes UTC and a post dated "today" can look like it's in
# the future and silently not publish. Change this if you move.
timeZone = "Asia/Seoul"
copyright = "Seyoon Park"

enableRobotsTXT = true
enableEmoji = true

# Tag pages are titled with the tag exactly as written, so "#meta" doesn't come
# back as "#Meta". Pages with an explicit `title` are unaffected.
capitalizeListTitles = false

# Nothing is published until you say so.
buildDrafts = false
buildFuture = false

# Trailing-slash-free, readable URLs: /writing/some-post/
# :contentbasename, not :slug. `:slug` falls back to the title, so editing a
# post's title silently changes its URL and breaks every link to it. The file
# name is the stable identity; set `slug:` in front matter to override.
[permalinks]
  writing = "/writing/:contentbasename/"

[params]
  author = "Seyoon Park"

  # The masthead on the home page reads: hangul, then the latin name, then
  # hanja. Leave either of these empty and that part simply doesn't appear.
  #
  # The characters are baked into a 2 KB subset of Noto Serif KR. If you change
  # them here, run ./scripts/name-font.sh with the new string or they'll fall
  # back to whatever serif the reader happens to have.
  nameKo = "박세윤"
  nameHanja = "朴世阭"

  description = "Seyoon Park — computer science at Oxford, writing about cryptography, quantum computation and contest problems."
  # The home page headline lives in content/_index.md, not here.

  # Written out longhand so address harvesters can't lift it. There is no
  # mailto: link anywhere on the site, which is the point.
  emailUser = "fenwickyduck"
  emailDomain = "gmail"
  emailTLD = "com"
  github = "https://github.com/fenwickyduck"
  linkedin = "https://www.linkedin.com/in/seyoon-park-andrew/"
  # Set to false to hide the light/dark toggle.
  showThemeToggle = true

  # How deep the contents list on a post goes. 3 means h2 and h3; the h4s on
  # this site are labels rather than sections, so they stay out of it. Read by
  # layouts/_partials/toc.html, which is the only thing that builds a TOC.
  tocDepth = 3

# pageRef, not url: it resolves to a real page, which is what lets Hugo mark
# the current item. With `url` the active state silently never matches.
[menu]
  [[menu.main]]
    name = "Home"
    pageRef = "/"
    weight = 5
  [[menu.main]]
    name = "Writing"
    pageRef = "/writing"
    weight = 10
  [[menu.main]]
    name = "Tools"
    pageRef = "/projects"
    weight = 20
  [[menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 30

[markup]
  [markup.goldmark.renderer]
    # Allow raw HTML in posts when you need it.
    unsafe = true
  [markup.goldmark.parser]
    # Let a `{.class}` line attach a class to the block above it, so prose can
    # tag a paragraph (e.g. a lemma statement) without wrapping it in raw HTML.
    [markup.goldmark.parser.attribute]
      block = true
  [markup.goldmark.extensions]
    [markup.goldmark.extensions.typographer]
      disable = false
    # LaTeX maths. $x$ inline, $$x$$ display. Rendered to MathML at build time
    # by layouts/_markup/render-passthrough.html, so no KaTeX ships to readers.
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    noClasses = false          # use CSS classes so highlighting follows the theme
    lineNos = false
    tabWidth = 2
    guessSyntax = true
  # No [markup.tableOfContents] here on purpose. It only configures Hugo's
  # prebuilt `.TableOfContents`, which nothing on this site calls: the contents
  # list is built from `.Fragments`, which ignores that section entirely.
  # Depth lives in [params] as `tocDepth`.

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[services]
  [services.rss]
    limit = 30

[minify]
  disableXML = true
  minifyOutput = true
