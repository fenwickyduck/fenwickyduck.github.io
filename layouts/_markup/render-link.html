{{- $u := urls.Parse .Destination -}}
{{- $external := and $u.Host (ne $u.Host (urls.Parse site.BaseURL).Host) -}}
<a href="{{ .Destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $external }} class="external" rel="noopener" target="_blank"{{ end }}>{{ .Text | safeHTML }}</a>
{{- /* Trailing trim: an inline hook must not emit a newline after the link. */ -}}
